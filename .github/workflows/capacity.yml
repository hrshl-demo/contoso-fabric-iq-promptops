name: capacity

# Status, resume and pause of the F4 by hand, and a guard that pauses it every 3 hours when someone forgot (so a forgotten capacity bills for 3 hours
# at most, about USD 2.2; GitHub can start a scheduled run a few minutes late).
# DRAFT: not run against a live tenant yet. It does nothing until the repository variable CD_ENABLED is "true" (docs/SETUP.md);
# a skipped job costs no Actions minutes. Before a demo set the variable CD_GUARD_HOLD_UNTIL (for example 2026-11-05T20:00:00Z) so the guard
# leaves a running capacity alone until then, and remove it afterwards.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "status changes nothing; resume starts billing; pause stops it; guard pauses only when it is running"
        type: choice
        options: [status, resume, pause, guard]
        default: status
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: read

concurrency:
  group: fabric-capacity
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  capacity:
    name: Capacity
    if: ${{ vars.CD_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    env:
      CD_RESOURCE_GROUP: ${{ vars.CD_RESOURCE_GROUP }}
      CD_CAPACITY: ${{ vars.CD_CAPACITY }}
      CD_LOCATION: ${{ vars.CD_LOCATION }}
      CD_USD_PER_HOUR: ${{ vars.CD_USD_PER_HOUR }}
      CD_GUARD_HOLD_UNTIL: ${{ vars.CD_GUARD_HOLD_UNTIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            kit/requirements.txt
            requirements-ci.txt
      - name: Install the requirements
        run: python -m pip install -r kit/requirements.txt -r requirements-ci.txt
      - name: Sign in to Azure (federated credential, no secret)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Run the action
        env:
          ACTION: ${{ inputs.action || 'guard' }}
        run: python -m tools.cd capacity "$ACTION" --summary "$GITHUB_STEP_SUMMARY"
