tables:
  - table: product
    entity: Product
    tier: core
    domain: Catalogue
    description: "A bank product: savings, fixed and recurring deposit, sweep, credit and debit card, home loan, health cover. 24 catalogue products carry full terms; products referenced only by Frontier records (card, floating home loan, education term cover, index fund) are reference stubs with no terms: do not quote rates or fees for them. Rupee parameters here are whole rupees, rates are percent."
    synonyms: [offering, scheme, plan, card type, deposit scheme]
    allow_duplicates: true    # CB-SAV-SALARY is both a catalogue product and a Frontier reference; the catalogue row wins by source order
    post: [product_names]
    sources:
      - {release: retail4-v1, file: products.json, set: {data_role: catalogue}}
      - {data: relationship/products.json, set: {data_role: relationship_proposal}}
      - {release: retail-frontier-v1, file: products.json, set: {data_role: reference_only}}
    columns:
      - {col: product_id, type: string, key: true, from: productId, desc: "Product code such as CB-FD-STANDARD or CB-CARD-CLASSIC."}
      - {col: display_name, type: string, default_label: true, from: [displayName, productType], desc: "Customer-facing product name. Reference stubs show their type only."}
      - {col: family, type: string, from: [family, productType], desc: "Product family: savings, fixed_deposit, recurring_deposit, sweep, credit_card, debit_card, prepaid_card, home_loan, health_cover, personal_loan, goal_pocket, or a Frontier product type."}
      - {col: data_role, type: string, from: [dataRole, "$data_role"], desc: "catalogue (full terms), relationship_proposal (planner proposal, not an approved offer) or reference_only (stub with no terms)."}
      - {col: status, type: string, from: status, desc: "Catalogue status such as active or proposed."}
      - {col: issuer, type: string, from: issuer, desc: "Issuer name (synthetic)."}
      - {col: catalogue_version, type: string, from: catalogueVersion, desc: "Catalogue version, for example catalogue-v1."}
      - {col: effective_from, type: date, from: effectiveFrom, desc: "Date the product terms take effect."}
      - {col: effective_to, type: date, from: effectiveTo, desc: "Date the terms end; null while open."}
      - {col: audience, type: string, from: audienceDescription, t: join, desc: "Who the product suits."}
      - {col: main_tradeoff, type: string, from: mainTradeoff, t: join, desc: "The main trade-off of choosing the product."}
      - {col: why_not_suitable, type: string, from: whyNotSuitable, t: join, desc: "Who the product does not suit."}
      - {col: rate_terms, type: string, from: rateTerms, t: join, desc: "Plain-language rate or cashback terms."}
      - {col: liquidity_terms, type: string, from: liquidityTerms, t: join, desc: "Plain-language liquidity terms."}
      - {col: benefits_text, type: string, from: benefits, t: join, desc: "Benefits (semicolon separated)."}
      - {col: fees_text, type: string, from: fees, t: join, desc: "Fees (semicolon separated)."}
      - {col: limitations_text, type: string, from: limitations, t: join, desc: "Limitations (semicolon separated)."}
      - {col: required_evidence, type: string, from: requiredEvidence, t: join, desc: "Evidence needed to apply (semicolon separated)."}
      - {col: supported_actions, type: string, from: supportedActions, t: join, desc: "What the assistant may do: prepare_application, keep_current, request_information."}
      - {col: underwriting_required, type: bool, from: underwritingRequired, desc: "True when the product needs underwriting."}
      - {col: min_age, type: int, from: eligibilityRules.minimumAge, desc: "Minimum customer age in years."}
      - {col: min_monthly_income_inr, type: double, from: eligibilityRules.minimumMonthlyIncome, t: float, desc: "Minimum monthly income in rupees."}
      - {col: min_principal_inr, type: double, from: [eligibilityRules.minimumPrincipal, parameters.minimumPrincipal], t: float, desc: "Minimum amount to place or borrow, in rupees."}
      - {col: max_principal_inr, type: double, from: parameters.maximumPrincipal, t: float, desc: "Maximum amount to place or borrow, in rupees."}
      - {rate_pct: interest_rate, from: parameters.interestRatePct, label: Interest Rate, desc: "Annual interest rate of the product."}
      - {col: annual_fee_inr, type: double, from: parameters.annualFee, t: float, desc: "Annual fee in rupees."}
      - {col: monthly_fee_inr, type: double, from: parameters.monthlyFee, t: float, desc: "Monthly fee in rupees."}
      - {col: minimum_balance_inr, type: double, from: parameters.minimumBalance, t: float, desc: "Minimum balance to maintain, in rupees."}
      - {col: processing_fee_pct, type: double, from: parameters.processingFeePct, t: float, desc: "Processing fee as a percentage of the amount."}
      - {col: prepayment_charge_pct, type: double, from: parameters.prepaymentChargePct, t: float, desc: "Prepayment charge as a percentage."}
      - {col: early_withdrawal_penalty_pct, type: double, from: parameters.prematureWithdrawalPenaltyPct, t: float, desc: "Penalty percentage for withdrawing a deposit early."}
      - {col: min_term_months, type: int, from: parameters.minimumTermMonths, desc: "Shortest term in months."}
      - {col: max_term_months, type: int, from: parameters.maximumTermMonths, desc: "Longest term in months."}
      - {col: max_tenure_years, type: int, from: parameters.maximumTenureYears, desc: "Longest loan tenure in years."}
      - {col: max_ltv_pct, type: double, from: parameters.maximumLtvPct, t: float, desc: "Maximum loan-to-value percentage."}
      - {col: cashback_pct, type: double, from: parameters.cashbackPct, t: float, desc: "Cashback percentage on spends."}
      - {col: forex_markup_pct, type: double, from: parameters.forexMarkupPct, t: float, desc: "Foreign exchange mark-up percentage."}
      - {col: monthly_premium_inr, type: double, from: parameters.monthlyPremium, t: float, desc: "Monthly premium in rupees."}
      - {col: sum_insured_inr, type: double, from: parameters.sumInsured, t: float, desc: "Sum insured in rupees."}
      - {col: rate_type, type: string, from: parameters.rateType, desc: "Loan rate type: fixed or floating."}
      - {col: payout_mode, type: string, from: parameters.payoutMode, desc: "Deposit payout mode: monthly, quarterly, on_maturity."}
      - {col: disclosure, type: string, from: disclosureText, desc: "Mandatory demo disclosure."}
      - {col: release_id, type: string, from: [releaseId, "$release"], desc: "Seed release the row comes from."}

  - table: product_parameter
    entity: ProductParameter
    tier: extended
    domain: Catalogue
    description: "Every raw catalogue parameter of every product as name/value rows (nested names are dotted, such as eligibility.minimumAge). Use it for parameters that Product does not expose as a column."
    synonyms: [product term, product attribute, catalogue parameter]
    sources:
      - {custom: product_parameter, files: ["data/releases/retail4-v1/products.json", "data/relationship/products.json"]}
    columns:
      - {col: parameter_id, type: string, key: true, tpl: "{productId}.{name}", desc: "Identifier: product id and parameter name."}
      - {col: product_id, type: string, from: productId, desc: "Product the parameter belongs to."}
      - {col: parameter_name, type: string, default_label: true, from: name, desc: "Parameter name such as annualFee or eligibility.minimumAge."}
      - {col: value_text, type: string, from: value, t: str, desc: "Parameter value as text. Rupee values are whole rupees, rates are percent."}
      - {col: value_number, type: double, from: value, t: num_or_null, desc: "Parameter value when numeric."}

  - table: journey
    entity: Journey
    tier: core
    domain: Catalogue
    description: "A conversation journey the assistant runs. Legacy J01-J12 are goal-led playbooks (retirement income, scam check, card fit, ...) with triggers, must-establish facts and never-do rules. Frontier F01-F06 are the household journeys, each with specialists, an autonomy ceiling and the operations it may only prepare."
    synonyms: [playbook, use case, conversation flow, scenario, intent flow]
    sources:
      - {data_glob: "journeys/J[0-9][0-9].json", single: true, set: {kind: legacy}}
      - {custom: frontier_journeys, doc: "docs/Frontier-Retail-Strategy-PRD-Architecture-Handover.md", crosswalk_heading: "8. Six journeys and exact fourteen-requirement crosswalk", behavior_heading: "Journey behavior", set: {kind: frontier}}
    columns:
      - {col: journey_id, type: string, key: true, from: journeyId, desc: "Journey identifier: J01-J12 (legacy) or F01-F06 (Frontier)."}
      - {col: title, type: string, default_label: true, from: title, desc: "Journey title."}
      - {col: journey_kind, type: string, from: "$kind", desc: "legacy (J) or frontier (F)."}
      - {col: one_liner, type: string, from: oneLiner, desc: "One-line promise of the journey."}
      - {col: goal, type: string, from: goal, desc: "What the journey must achieve for the customer (legacy)."}
      - {col: bu_id, type: string, from: buId, desc: "Business unit that owns the journey (legacy)."}
      - {col: sales_posture, type: string, from: salesPosture, desc: "advise, light_touch or never_sell: how much selling is allowed (legacy)."}
      - {col: turn_cap, type: int, from: turnCap, desc: "Maximum conversation turns before handoff (legacy, when set)."}
      - {col: autonomy_ceiling, type: int, from: autonomyCeiling, desc: "Highest workflow level the journey may request (Frontier). It grants no authority by itself."}
      - {col: primary_specialists, type: string, from: primarySpecialists, desc: "Specialist agents used by the journey (Frontier)."}
      - {col: allowed_prepared_operations, type: string, from: allowedOperations, desc: "Operations the journey may only prepare, never execute (Frontier)."}
      - {col: triggers_text, type: string, from: triggers, t: join, desc: "Phrases and situations that start the journey (legacy)."}
      - {col: must_establish_text, type: string, from: mustEstablish, t: join, desc: "Facts that must be established before advising (legacy)."}
      - {col: never_do_text, type: string, from: neverDo, t: join, desc: "Things the assistant must never do in this journey (legacy)."}
      - {col: tool_hints, type: string, from: toolHints, t: join, desc: "Tools the journey normally uses (legacy)."}
      - {col: opener_examples, type: string, from: openers, t: join, desc: "Example customer openers (legacy)."}

  - table: sop
    entity: Sop
    tier: core
    domain: Catalogue
    description: "A standard operating procedure the assistant follows (retirement income review, suspected fraud, card controls, request handling). The procedure text lives in Foundry IQ; this entity says which SOP exists, its scope and which case it applies to."
    synonyms: [procedure, runbook, bank procedure, policy document]
    sources:
      - {release: retail4-v1, file: sops.json}
    columns:
      - {col: sop_id, type: string, key: true, from: sopId, desc: "SOP identifier such as SOP-UC03-SUSPECTED-FRAUD."}
      - {col: title, type: string, default_label: true, from: title, desc: "SOP title."}
      - {col: scope, type: string, from: scope, desc: "case (one use case) or shared (all cases)."}
      - {col: audience, type: string, from: audience, desc: "Who the SOP is for, for example bank_global."}
      - {col: applies_to_case, type: string, from: appliesToCase, desc: "Use case the SOP applies to, for example UC03."}
      - {col: knowledge_path, type: string, from: knowledgePath, desc: "Path of the SOP text in the knowledge store."}
      - {col: source_version, type: int, from: sourceVersion, desc: "SOP version number."}
      - {col: release_id, type: string, from: "$release", desc: "Seed release the row comes from."}

  - table: journey_sop
    entity: JourneySop
    tier: extended
    domain: Catalogue
    description: "Link between a legacy journey and the SOPs it follows."
    synonyms: [journey procedure link]
    sources:
      - {data_glob: "journeys/J[0-9][0-9].json", single: true, explode: sopIds}
    columns:
      - {col: link_id, type: string, key: true, tpl: "{^.journeyId}>{@}", desc: "Link identifier: journey id > SOP id."}
      - {col: journey_id, type: string, from: ^.journeyId, desc: "Journey."}
      - {col: sop_id, type: string, default_label: true, from: "@", desc: "SOP the journey follows."}

  - table: journey_product
    entity: JourneyProduct
    tier: extended
    domain: Catalogue
    description: "Link between a legacy journey and the products it may discuss."
    synonyms: [journey product link]
    sources:
      - {data_glob: "journeys/J[0-9][0-9].json", single: true, explode: productIds}
    columns:
      - {col: link_id, type: string, key: true, tpl: "{^.journeyId}>{@}", desc: "Link identifier: journey id > product id."}
      - {col: journey_id, type: string, from: ^.journeyId, desc: "Journey."}
      - {col: product_id, type: string, default_label: true, from: "@", desc: "Product the journey may discuss."}

  - table: law
    entity: Law
    tier: core
    domain: Policy
    description: "One of the bank's twelve non-negotiable design laws for the conversational and agentic experience (no figure without authority, no consent by implication, no execution by language, no double allocation, no future money as cash, no stale authority, no self-expanding agent, no sales during harm, ...). The same laws are loaded as ontology rules."
    synonyms: [rule, principle, guardrail, constraint, policy]
    sources:
      - {doc: "docs/Frontier-Retail-Strategy-PRD-Architecture-Handover.md", heading: "5. Laws"}
    columns:
      - {col: law_id, type: string, key: true, from: Law, t: "re:^(L\\d+)", desc: "Law identifier L1-L12."}
      - {col: name, type: string, default_label: true, from: Law, t: "re:^L\\d+:\\s*(.*)$", desc: "Short name of the law."}
      - {col: required_behavior, type: string, from: "Required behavior", desc: "Behaviour the law requires."}

  - table: authority_rule
    entity: AuthorityRule
    tier: core
    domain: Policy
    description: "Who may do what: for each capability (ask, read, calculate, retrieve policy, prepare, approve, execute, review, expand consent) the permission of each actor (customer, Financial Companion, specialist, Rhea agent, active mandate, human specialist, deterministic bank). Analysis, preparation and effect are separate; the default agent mode is prepare-only."
    synonyms: [authority matrix, permission matrix, who can approve, who can execute]
    sources:
      - {custom: authority_matrix, doc: "docs/Frontier-Retail-Strategy-PRD-Architecture-Handover.md", heading: "10. Autonomy and authority matrix"}
    columns:
      - {col: rule_id, type: string, key: true, tpl: "{capability} / {actor}", desc: "Identifier: capability / actor."}
      - {col: capability, type: string, default_label: true, from: capability, desc: "Capability such as Approve customer action or Execute bounded surplus action."}
      - {col: actor, type: string, from: actor, desc: "Actor: Customer, Financial Companion, Specialist, Rhea agent, Active mandate, Human specialist, Deterministic bank."}
      - {col: permission_class, type: string, from: text, t: perm_class, desc: "yes, no or qualified (read PermissionText for the condition)."}
      - {col: permission_text, type: string, from: text, desc: "What the actor may do for the capability, as written in the authority matrix."}

  - table: frontier_requirement
    entity: FrontierRequirement
    tier: extended
    domain: Policy
    description: "One of the fourteen retail requirements (R01-R14) the Frontier journeys must deliver, with the deterministic outcome that proves it."
    synonyms: [requirement, R01, acceptance criterion]
    sources:
      - {doc: "docs/Frontier-Retail-Strategy-PRD-Architecture-Handover.md", heading: "8. Six journeys and exact fourteen-requirement crosswalk"}
    columns:
      - {col: requirement_id, type: string, key: true, from: Requirement, desc: "Requirement identifier R01-R14."}
      - {col: retail_requirement, type: string, default_label: true, from: "Retail requirement", desc: "Requirement name such as Emergency fund or Scam intervention."}
      - {col: journey_id, type: string, from: Journey, t: "re:^(F\\d\\d)", desc: "Frontier journey that delivers the requirement."}
      - {col: deterministic_outcome, type: string, from: "Implemented deterministic outcome", desc: "Deterministic outcome that proves the requirement."}

  - table: bank_agent
    entity: BankAgent
    tier: extended
    domain: Policy
    description: "One of the eight agents in the Frontier multi-agent model: the Financial Companion orchestrator, six specialists and Rhea's personal agent. None has direct ledger authority."
    synonyms: [agent roster, specialist, orchestrator]
    sources:
      - {doc: "docs/Frontier-Retail-Strategy-PRD-Architecture-Handover.md", heading: "9. Multi-agent model"}
    columns:
      - {col: agent_name, type: string, key: true, default_label: true, from: Agent, desc: "Agent name."}
      - {col: form, type: string, from: Form, desc: "How the agent is built, for example Managed prompt specialist."}
      - {col: responsibility, type: string, from: Responsibility, desc: "What the agent is responsible for."}
      - {col: direct_ledger_authority, type: string, from: "Direct ledger authority", desc: "None for every agent: only the deterministic bank changes state."}
