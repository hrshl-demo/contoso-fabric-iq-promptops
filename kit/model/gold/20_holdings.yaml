tables:
  - table: account
    entity: Account
    tier: core
    domain: Holdings
    kind: dimension
    grain: "One account, with its balances as at the release business date."
    physical: dim_account
    silver: [silver_account]
    description: "A deposit account (salary, reserve, savings). Frontier Rhea has acc-rhea-primary and acc-rhea-reserve. Balances are INR; the *_paise twins are exact integer paise. Posted balance is what the customer owns; available balance is net of holds."
    synonyms: [bank account, savings account, salary account, current account, a/c, balance]
    sources:
      - {silver: silver_account}
    columns:
      - {col: account_id, type: string, key: true, from: accountId, desc: "Account identifier such as acc-rhea-primary."}
      - {col: customer_id, type: string, from: _owner_id, t: owner, desc: "Owning customer."}
      - {col: product_id, type: string, from: productId, desc: "Catalogue product the account was opened under, for example CB-SAV-SALARY."}
      - {col: account_type, type: string, default_label: true, from: xAccountType, desc: "Account type such as salary or reserve (Frontier only)."}
      - {col: status, type: string, from: xStatus, desc: "Account status such as active."}
      - {col: currency, type: string, from: currency, desc: "ISO currency code; always INR in this data."}
      - {col: opened_on, type: date, from: openedOn, desc: "Date the account was opened (legacy only)."}
      - {col: history_start_on, type: date, from: xHistoryStart, desc: "First date covered by the seeded transaction history (Frontier only)."}
      - {col: balance_as_on, type: date, from: [xBalanceAsOf, xReleaseBusinessDate], desc: "Date the balances are valid for (the release business date)."}
      - {money: opening_balance, label: Opening Balance, from: xOpeningBalanceMinor, desc: "Balance at the start of the seeded history."}
      - {money: posted_balance, label: Posted Balance, from: postedBalanceMinor, desc: "Ledger balance of posted transactions."}
      - {money: available_balance, label: Available Balance, from: availableBalanceMinor, desc: "Balance the customer can use after holds."}
      - {money: holds_amount, label: Holds, from: holdsMinor, desc: "Amount on hold (legacy only)."}
      - {col: release_id, type: string, from: _release_id, desc: "Seed release the row comes from."}

  - table: card
    entity: Card
    tier: core
    domain: Holdings
    kind: dimension
    grain: "One card."
    physical: dim_card
    silver: [silver_card]
    description: "A debit or credit card linked to an account. Frontier Rhea's credit card card-rhea-frontier is temporarily locked after a dispute. Only masked numbers exist. Credit limit is not cash."
    synonyms: [credit card, debit card, plastic]
    sources:
      - {silver: silver_card}
    columns:
      - {col: card_id, type: string, key: true, from: cardId, desc: "Card identifier such as card-rhea-frontier."}
      - {col: customer_id, type: string, from: _owner_id, t: owner, desc: "Card holder."}
      - {col: account_id, type: string, from: linkedAccountId, desc: "Account the card is linked to."}
      - {col: product_id, type: string, from: productId, desc: "Catalogue product of the card."}
      - {col: card_type, type: string, default_label: true, from: cardType, desc: "debit or credit."}
      - {col: status, type: string, from: xStatus, desc: "Card status such as active or temporarily_locked_after_dispute."}
      - {col: masked_number, type: string, pii: true, from: maskedNumber, desc: "Masked card number showing only the last four digits (legacy only). Never read it aloud in full."}
      - {col: expiry_mm_yy, type: string, from: expiry, desc: "Card expiry as MM/YY (legacy only)."}
      - {money: credit_limit, label: Credit Limit, from: limitMinor, desc: "Approved credit limit. A limit is not available cash."}
      - {money: available_credit, label: Available Credit, from: availableCreditMinor, desc: "Credit still available to spend."}
      - {money: outstanding_balance, label: Outstanding Balance, from: outstandingMinor, desc: "Amount currently owed on the card."}
      - {money: minimum_due, label: Minimum Due, from: xMinimumDueMinor, desc: "Minimum payment due on the latest statement (legacy only)."}
      - {rate_bps: annual_rate, from: xAnnualRateBps, desc: "Annual interest rate on card balances (Frontier only)."}
      - {col: statement_day, type: int, from: xStatementDay, desc: "Day of month the statement is generated (Frontier only)."}
      - {col: payment_due_day, type: int, from: xPaymentDueDay, desc: "Day of month payment is due (Frontier only)."}
      - {col: payment_due_on, type: date, from: xPaymentDueDate, desc: "Next payment due date (legacy only)."}
      - {col: statement_from, type: date, from: xStatementPeriodFrom, desc: "Start of the current statement period (legacy only)."}
      - {col: statement_to, type: date, from: xStatementPeriodTo, desc: "End of the current statement period (legacy only)."}
      - {col: international_enabled, type: bool, from: xControlsInternationalTransactions, desc: "True when international use is switched on (legacy only)."}
      - {col: online_enabled, type: bool, from: xControlsOnlineTransactions, desc: "True when online use is switched on (legacy only)."}
      - {col: contactless_enabled, type: bool, from: xControlsContactless, desc: "True when contactless use is switched on (legacy only)."}
      - {col: release_id, type: string, from: _release_id, desc: "Seed release the row comes from."}

  - table: deposit
    entity: Deposit
    tier: core
    domain: Holdings
    kind: dimension
    grain: "One deposit."
    physical: dim_deposit
    silver: [silver_deposit]
    description: "A fixed deposit. Frontier Rhea holds dep-rhea-liquid-001 (liquid, withdrawable with a penalty). Maturity proceeds are not spendable cash until a maturity posting exists. The same money can also be an Investment: for net position or total assets count it once, through Investment (Law L5)."
    synonyms: [fixed deposit, FD, term deposit, time deposit]
    sources:
      - {silver: silver_deposit}
    columns:
      - {col: deposit_id, type: string, key: true, from: depositId, desc: "Deposit identifier such as dep-rhea-liquid-001."}
      - {col: customer_id, type: string, from: _owner_id, t: owner, desc: "Depositor."}
      - {col: product_id, type: string, from: productId, desc: "Catalogue product of the deposit."}
      - {col: linked_account_id, type: string, from: linkedAccountId, desc: "Account the deposit is linked to (legacy only)."}
      - {col: status, type: string, default_label: true, from: xStatus, desc: "Deposit status such as active (legacy only)."}
      - {money: principal, label: Principal, from: principalMinor, desc: "Amount placed in the deposit."}
      - {rate_bps: annual_rate, from: ratePct, unit: pct_text, desc: "Annual interest rate (Frontier only)."}
      - {col: opened_on, type: date, from: openedOn, desc: "Date the deposit was opened."}
      - {col: matures_on, type: date, from: maturesOn, desc: "Maturity date. A date alone creates no interest or cash."}
      - {col: liquidity_class, type: string, from: xLiquidityClass, desc: "How quickly the money can be reached, for example available_with_penalty (Frontier only)."}
      - {col: maturity_instruction, type: string, from: xMaturityInstruction, desc: "What happens at maturity, for example renew_principal_and_interest (legacy only)."}
      - {rate_bps: premature_penalty, from: xPrematureWithdrawalPenaltyBps, desc: "Penalty for withdrawing before maturity (Frontier only)."}
      - {col: release_id, type: string, from: _release_id, desc: "Seed release the row comes from."}

  - table: loan
    entity: Loan
    tier: core
    domain: Holdings
    kind: dimension
    grain: "One loan."
    physical: dim_loan
    silver: [silver_loan]
    description: "A loan facility. Frontier Rhea has a floating-rate home loan (loan-home-001) and an education loan. Current principal is what is still owed; EMI is the monthly instalment. A disbursed loan is a liability, not income."
    synonyms: [home loan, mortgage, EMI, credit facility, borrowing]
    sources:
      - {silver: silver_loan}
    columns:
      - {col: loan_id, type: string, key: true, from: liabilityId, desc: "Loan identifier such as loan-home-001."}
      - {col: customer_id, type: string, from: _owner_id, t: owner, desc: "Borrower."}
      - {col: product_id, type: string, from: productId, desc: "Catalogue product of the loan, for example CB-HL-FLOATING."}
      - {col: purpose, type: string, default_label: true, from: xPurpose, desc: "Loan purpose such as owner_occupied_home."}
      - {col: rate_type, type: string, from: xRateType, desc: "floating or fixed."}
      - {rate_bps: annual_rate, from: ratePct, unit: pct_text, desc: "Annual interest rate of the loan."}
      - {money: opening_principal, label: Opening Principal, from: xOpeningPrincipalMinor, desc: "Principal at the start of the seeded history."}
      - {money: current_principal, label: Current Principal, from: outstandingMinor, desc: "Principal still owed."}
      - {money: emi, label: EMI, from: monthlyPaymentMinor, desc: "Monthly instalment."}
      - {money: origination_fee, label: Origination Fee, from: xOriginationFeeMinor, desc: "One-time fee charged at origination."}
      - {col: prepayment_applies_to, type: string, from: xPrepaymentTermsAppliesTo, desc: "Borrower type the prepayment terms apply to."}
      - {rate_bps: prepayment_charge, from: xPrepaymentTermsChargeBps, desc: "Charge on prepayment."}
      - {money: prepayment_minimum, label: Prepayment Minimum, from: xPrepaymentTermsMinimumAmountMinor, desc: "Smallest allowed prepayment."}
      - {col: prepayment_notice_days, type: int, from: xPrepaymentTermsNoticeDays, desc: "Days of notice needed before a prepayment."}
      - {col: scheduled_installments, type: int, from: xRepaymentScheduleCount, desc: "Number of instalments in the seeded repayment schedule."}
      - {col: release_id, type: string, from: _release_id, desc: "Seed release the row comes from."}

  - table: loan_installment
    entity: LoanInstallment
    tier: core
    domain: Holdings
    kind: fact
    grain: "One scheduled instalment of a loan."
    grain_key: [loan_id, installment_number]
    physical: fact_loan_installment
    silver: [silver_loan_installment]
    description: "One scheduled or paid EMI of a loan, split into principal, interest and fees. Use it for questions about interest paid so far or the next instalment."
    synonyms: [EMI payment, instalment, repayment]
    sources:
      - {silver: silver_loan_installment}
    columns:
      - {col: installment_id, type: string, key: true, tpl: "{loanId}#{ordinal:02d}", desc: "Instalment identifier: loan id plus instalment number."}
      - {col: loan_id, type: string, from: loanId, desc: "Loan the instalment belongs to."}
      - {col: installment_number, type: int, from: installmentNumber, desc: "Sequence number of the instalment (1 = first)."}
      - {col: due_on, type: date, from: dueDate, desc: "Due date of the instalment."}
      - {col: status, type: string, default_label: true, from: status, desc: "paid or scheduled."}
      - {money: opening_principal, label: Opening Principal, from: openingPrincipalMinor, desc: "Principal at the start of the instalment."}
      - {money: principal_paid, label: Principal Paid, from: principalPaidMinor, desc: "Principal repaid by this instalment."}
      - {money: interest_paid, label: Interest Paid, from: interestPaidMinor, desc: "Interest paid in this instalment."}
      - {money: fees_paid, label: Fees Paid, from: feesPaidMinor, desc: "Fees paid in this instalment."}
      - {money: total_paid, label: Total Paid, from: totalPaidMinor, desc: "Total paid: principal + interest + fees."}
      - {money: closing_principal, label: Closing Principal, from: closingPrincipalMinor, desc: "Principal remaining after this instalment."}
      - {col: payment_description, type: string, from: paymentTransactionDescription, desc: "Bank statement narration of the payment, for example HOME LOAN EMI."}

  - table: insurance_policy
    entity: ProtectionPolicy
    tier: core
    domain: Holdings
    kind: dimension
    grain: "One insurance policy."
    physical: dim_protection_policy
    renamed_from: {entity: InsurancePolicy, physical: dim_insurance_policy}
    silver: [silver_protection_policy]
    description: "An insurance policy (protection policy) held by a customer (term life, family health, individual health). Sum insured is cover, not cash. New cover is never retroactive and never guaranteed reimbursement."
    synonyms: [insurance policy, policy, cover, health cover, term cover, life insurance, health insurance]
    sources:
      - {silver: silver_protection_policy}
    columns:
      - {col: policy_id, type: string, key: true, from: policyId, desc: "Policy identifier such as policy-term-001."}
      - {col: customer_id, type: string, from: _owner_id, t: owner, desc: "Policy holder."}
      - {col: product_id, type: string, from: productId, desc: "Catalogue product the policy was bought under."}
      - {col: policy_type, type: string, default_label: true, from: coverType, desc: "Cover type such as term_life, family_health or individual_health_indemnity."}
      - {col: status, type: string, from: xStatus, desc: "Policy status such as active."}
      - {col: insurer, type: string, from: xInsurer, desc: "Insurer name (legacy only; fictional)."}
      - {money: premium, label: Premium, from: premiumMinor, desc: "Premium per payment period."}
      - {col: premium_cadence, type: string, from: premiumFrequency, desc: "How often the premium is paid, for example monthly."}
      - {money: sum_insured, label: Sum Insured, from: sumInsuredMinor, desc: "Cover amount. Not cash and not guaranteed reimbursement."}
      - {col: beneficiary_member_ids, type: string, from: xBeneficiaries, desc: "Household members named as beneficiaries (semicolon separated)."}
      - {col: covered_member_ids, type: string, from: xCoveredMembers, desc: "People covered by the policy (semicolon separated)."}
      - {col: started_on, type: date, from: startedOn, desc: "Policy start date (legacy only)."}
      - {col: renews_on, type: date, from: renewsOn, desc: "Next renewal date (legacy only)."}
      - {col: linked_account_id, type: string, from: linkedAccountId, desc: "Account the premium is paid from (legacy only)."}
      - {col: co_pay_pct, type: double, from: xCoPayPct, t: dec_to_float, desc: "Co-payment percentage (legacy only)."}
      - {col: initial_waiting_days, type: int, from: xWaitingPeriodsInitialDays, desc: "Initial waiting period in days (legacy only)."}
      - {col: pre_existing_waiting_months, type: int, from: xWaitingPeriodsPreExistingMonths, desc: "Waiting period for pre-existing conditions in months (legacy only)."}
      - {col: policy_number, type: string, pii: true, ontology: false, from: xPolicyNumber, desc: "Insurer policy number. Restricted."}
      - {col: release_id, type: string, from: _release_id, desc: "Seed release the row comes from."}

  - table: protection_gap
    entity: ProtectionGap
    tier: core
    domain: Holdings
    kind: fact
    grain: "One computed protection gap per customer and cover type at the business date (snapshot)."
    grain_key: [customer_id, gap_type]
    physical: fact_protection_gap
    silver: [silver_protection_gap]
    description: "A planning gap between existing and target protection (for example life cover). It is a synthetic planning figure, not a recommendation, quote or underwriting outcome."
    synonyms: [insurance gap, cover gap, protection shortfall]
    sources:
      - {silver: silver_protection_gap}
    columns:
      - {col: protection_gap_id, type: string, key: true, from: protectionGapId, desc: "Gap identifier such as gap-life-001."}
      - {col: customer_id, type: string, from: _owner_id, t: owner, desc: "Customer the gap was computed for."}
      - {col: gap_type, type: string, default_label: true, from: gapType, desc: "Type of cover, for example life_cover."}
      - {money: existing_protection, label: Existing Protection, from: existingProtectionMinor, desc: "Cover already in force."}
      - {money: target_protection, label: Target Protection, from: targetProtectionMinor, desc: "Cover the household would need."}
      - {money: gap, label: Protection Gap, from: gapMinor, desc: "Target minus existing protection."}
      - {money: income_replacement, label: Income Replacement, from: basisIncomeReplacementMinor, desc: "Part of the target that replaces income."}
      - {money: loan_and_education_needs, label: Loan And Education Needs, from: basisLoanAndEducationNeedsMinor, desc: "Part of the target that covers loans and education."}
      - {money: offset_liquid_assets, label: Offset Liquid Assets, from: basisOffsetLiquidAssetsMinor, desc: "Liquid assets deducted from the target."}
      - {col: disclosure, type: string, from: disclosure, desc: "Mandatory disclosure that this is a planning figure only."}
      - {col: release_id, type: string, from: _release_id, desc: "Seed release the row comes from."}

  - table: investment
    entity: Investment
    tier: core
    domain: Holdings
    kind: dimension
    grain: "One investment holding."
    physical: dim_investment
    silver: [silver_investment]
    description: "An investment holding (fixed deposit, index fund, reserve). Current value is a market-style figure from the seed, not a guaranteed return. Linked to the goals it funds. For net position or total assets use Investment value: a fixed deposit that is also an Investment is one asset, so never add Deposit principal on top of it (Law L5)."
    synonyms: [holding, mutual fund, SIP, portfolio item]
    sources:
      - {silver: silver_investment}
    columns:
      - {col: investment_id, type: string, key: true, from: investmentId, desc: "Investment identifier such as inv-liquid-fd."}
      - {col: customer_id, type: string, from: _owner_id, t: owner, desc: "Investor."}
      - {col: product_id, type: string, from: productId, desc: "Catalogue product of the investment."}
      - {col: investment_type, type: string, default_label: true, from: investmentType, desc: "Type such as fixed_deposit or index_fund."}
      - {col: liquidity, type: string, from: liquidity, desc: "How quickly the money can be reached."}
      - {money: current_value, label: Current Value, from: currentValueMinor, desc: "Current value of the holding."}
      - {col: goal_ids, type: string, from: goalRefs, desc: "Goals the investment funds (semicolon separated)."}
      - {col: release_id, type: string, from: _release_id, desc: "Seed release the row comes from."}

  - table: investment_goal
    entity: InvestmentGoal
    tier: extended
    domain: Holdings
    kind: bridge
    grain: "One link between an investment and a goal it funds."
    grain_key: [investment_id, goal_id]
    physical: bridge_investment_goal
    silver: [silver_investment_goal]
    description: "Link between an investment and a goal it funds. Use it to traverse from a goal to the investments behind it."
    synonyms: [goal funding link]
    sources:
      - {silver: silver_investment_goal}
    columns:
      - {col: link_id, type: string, key: true, tpl: "{investmentId}>{goalId}", desc: "Link identifier: investment id > goal id."}
      - {col: investment_id, type: string, from: investmentId, desc: "Investment."}
      - {col: goal_id, type: string, default_label: true, from: goalId, desc: "Goal the investment funds."}
